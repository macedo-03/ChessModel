services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.serving
    ports:
      - "8000:8000"
    environment:
      CHECKPOINT_PATH: /checkpoints/best.pt
    volumes:
      - ./src/chessmodel/training/output/checkpoints:/checkpoints:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Post-game queue: the bot pushes finished games here; nothing consumes
  # them yet until Phase 08's async commentary worker exists.
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.bot
    env_file:
      - .env # LICHESS_TOKEN -- never committed, see .gitignore
    environment:
      CHESSMODEL_API_URL: http://api:8000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

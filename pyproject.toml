[project]
name = "chessmodel"
version = "0.1.0"
description = "Explainable Chess AI — an end-to-end MLOps pipeline and serving infrastructure for an interpretable chess-playing model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-chess>=1.10",
    "numpy>=1.26",
    "torch>=2.13.0",
]

[project.optional-dependencies]
# Data ingestion, training, and the local/Kaggle MLOps tooling -- everything
# except the serving path itself.
training = [
    "dvc[s3]>=3.67.1",
    "requests>=2.34.2",
    "zstandard>=0.25.0",
    "tqdm>=4.70.0",
    "mlflow>=3.15.1",
    "kaggle>=2.2.4",
]
# The FastAPI inference API -- kept separate so the serving image doesn't
# drag in dvc/mlflow/kaggle and their (large) transitive dependency trees.
serving = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chessmodel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["chessmodel"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
